    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        background: #030303; 
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 999999;
      }
      .loader-dot {
        width: 12px;
        height: 12px;
        background: #bfa5d8;
        border-radius: 50%;
        animation: pulse 1.5s infinite ease-in-out;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(0.8); opacity: 0.5; }
        50% { transform: scale(1.2); opacity: 1; }
      }
    </style>
  </head>
  <body style="background-color: #030303; margin: 0;">
